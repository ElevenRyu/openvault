[package]
name = "openvault"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
description = "An agent-safe secrets vault: age-encrypted, Touch ID gated, no daemon, fast."
license = "MIT OR Apache-2.0"
repository = "https://github.com/ElevenRyu/openvault"
readme = "README.md"
keywords = ["secrets", "age", "vault", "cli", "agents"]
categories = ["command-line-utilities", "cryptography"]

[[bin]]
name = "openvault"
path = "src/main.rs"

[[bin]]
name = "ov"
path = "src/bin/ov.rs"

[dependencies]
anyhow = "1"
hmac = "0.12"
libc = "0.2"
age = { version = "0.12", features = ["plugin"] }
clap = { version = "4.5", default-features = false, features = ["std", "derive", "help", "usage", "error-context", "suggestions"] }
csv = "1.3"
getrandom = "0.3"
rpassword = "7.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
toml = { version = "0.8", default-features = false, features = ["parse"] }
zeroize = "1.8"
zip = { version = "9", default-features = false, features = ["deflate"] }

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"

# scrypt/X25519 are painfully slow unoptimized; keep deps fast in debug/test builds.
[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
opt-level = 3
