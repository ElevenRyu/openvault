# cargo-deny: licenses, advisories, bans and sources for the supply chain.
[graph]
all-features = false

[advisories]
version = 2
yanked = "deny"
ignore = [
    # crypto-bigint 0.5 timing issues: pulled in by age's p256 "tag" recipients /
    # hpke. openvault never holds a P-256 private key (Secure Enclave keys never
    # leave the enclave; the plugin does the ECDH), so no secret-dependent p256
    # arithmetic runs in-process. Remove once age moves to crypto-bigint >= 0.7.6.
    { id = "RUSTSEC-2026-0387", reason = "no in-process P-256 secret-key operations" },
    # basic-toml is unmaintained: build-time only, inside age's i18n proc-macros.
    { id = "RUSTSEC-2026-0374", reason = "build-time proc-macro dependency of age" },
]

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "BSL-1.0",
    "0BSD",
    "Unlicense",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
